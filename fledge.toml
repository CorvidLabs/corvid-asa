[project]
type = "static-site"

[tasks]
serve = "python3 -m http.server 8000"
validate-html = "test -f index.html && test -f styles.css && test -f 404.html"

[lanes.verify]
steps = ["validate-html"]

[merlin]
verify_before_complete = true
max_retries = 3

# Set one of these API keys in .env or your shell to enable the matching
# provider. OPENROUTER_API_KEY alone unlocks Claude/Gemini/Llama/DeepSeek.

[merlin.providers.openrouter]
type = "openai"
api_key_env = "OPENROUTER_API_KEY"
model = "anthropic/claude-sonnet-4-6"
base_url = "https://openrouter.ai/api/v1"
max_context_tokens = 200000

[merlin.providers.claude]
type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-4-6"
max_context_tokens = 200000

[merlin.providers.openai]
type = "openai"
api_key_env = "OPENAI_API_KEY"
model = "gpt-4.1-mini"
max_context_tokens = 128000

[merlin.providers.ollama]
type = "ollama"
api_key_env = "OLLAMA_API_KEY"
model = "qwen3-coder:480b"
base_url = "https://api.ollama.com"
max_context_tokens = 131072

[merlin.session]
ttl_days = 30
enabled = true
